name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # After the regular US close, Monday through Friday. The exporter keeps the
    # previous validated snapshot if a provider or validation check fails.
    - cron: "23 22 * * 1-5"
    # Once an hour through the US session (14:00-21:00 UTC), so the published
    # snapshot follows the market instead of waiting for the close.
    - cron: "7 14-21 * * 1-5"
  workflow_dispatch:

# Allow the deployment job to publish to Pages and mint its own OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  # Serialize publications so a cancelled or overlapping runner cannot lose an
  # already deployed active-book state.
  cancel-in-progress: false

jobs:
  build:
    outputs:
      data_status: ${{ steps.refresh_data.outputs.data_status }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-service/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r data-service/requirements.txt

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data-service/cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-

      - name: Recover last deployed portfolio state
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          REPOSITORY_NAME="${REPOSITORY#*/}"
          OWNER="${REPOSITORY%/*}"
          URL="https://${OWNER}.github.io/${REPOSITORY_NAME}/data/publication.json"
          if ! curl --fail --location --silent --show-error "$URL" --output /tmp/previous-publication.json; then
            cp frontend/public/data/publication.json /tmp/previous-publication.json \
              || cp data-service/seed/publication.json /tmp/previous-publication.json
          fi

      # Every deploy rebuilds the snapshot, pushes included. A push build used
      # to only validate the committed copy, which meant it redeployed whatever
      # was last committed — silently rolling back data that a scheduled run had
      # already published. The exporter keeps the previous validated snapshot
      # when a provider fails, so this never turns a provider outage into a
      # failed deploy.
      - name: Refresh and validate published data
        id: refresh_data
        run: python data-service/scripts/export_static.py --force --previous-publication /tmp/previous-publication.json

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /us-momentum-terminal/
          VITE_DATA_MODE: static

      - name: Run frontend tests
        run: npm --prefix frontend run test:unit

      - name: Add SPA fallback (404.html)
        run: cp frontend/dist/client/index.html frontend/dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/client

  deploy:
    needs: build
    # Publish whenever the build produced a valid artifact. A refresh that had
    # to fall back preserves the snapshot already live, so the artifact is never
    # worse than what is deployed — but gating on data_status == 'updated' also
    # skipped every push build whose refresh ended up preserved, which froze the
    # site on an old UI for days while the data stayed valid.
    if: needs.build.outputs.data_status != 'failed'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
