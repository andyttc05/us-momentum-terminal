name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # After the regular US close, Monday through Friday. The exporter keeps the
    # previous validated snapshot if a provider or validation check fails.
    - cron: "23 22 * * 1-5"
  workflow_dispatch:

# Allow the deployment job to publish to Pages and mint its own OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-service/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r data-service/requirements.txt

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data-service/cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-

      - name: Refresh and validate published data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: refresh_data
        run: python data-service/scripts/export_static.py

      - name: Validate committed published data
        if: github.event_name == 'push'
        run: python data-service/scripts/export_static.py --validate-only

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /us-momentum-terminal/
          VITE_DATA_MODE: static
          VITE_BACKTEST_API_BASE_URL: https://us-momentum-data.onrender.com/api

      - name: Run frontend tests
        run: npm --prefix frontend run test:unit

      - name: Add SPA fallback (404.html)
        run: cp frontend/dist/client/index.html frontend/dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
