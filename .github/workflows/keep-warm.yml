name: Keep the data service warm

# Render's free plan spins an instance down after ~15 minutes without traffic,
# and a cold start costs about a minute before it answers anything at all — far
# longer than a visitor waits for live data. On top of that, every push to main
# redeploys the service, which restarts it with an empty disk and a full
# 203-ticker rebuild.
#
# This workflow does not deploy anything or touch the data: it only makes sure
# the instance keeps answering. The site is designed to work without it (the
# published snapshot paints first), so a missed ping costs nothing.
on:
  schedule:
    # Every ten minutes keeps the instance inside Render's 15-minute idle
    # window even when GitHub delays a run.
    - cron: "*/10 * * * *"
    # Once an hour, hit the snapshot instead: that is the call that lets the
    # service refresh its own publication once the cache TTL expires.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the service
        env:
          SCHEDULE: ${{ github.event.schedule }}
          BASE: https://us-momentum-data.onrender.com
        run: |
          # The hourly run asks for the snapshot so the service can refresh its
          # publication; every other run is a cheapest-possible liveness ping.
          if [ "$SCHEDULE" = "7 * * * *" ]; then
            path="/api/snapshot"
          else
            path="/api/health"
          fi

          # A woken instance can take ~90s before it writes a byte, so wait it
          # out instead of giving up. A failure here must not fail the run:
          # the next ping arrives soon, and the site has a static fallback.
          code=$(curl -s -o /dev/null --max-time 120 -w "%{http_code}" "$BASE$path" || true)
          echo "$BASE$path -> $code"

          if [ "$code" = "000" ]; then
            echo "::warning::The data service did not answer within 120s."
          fi
