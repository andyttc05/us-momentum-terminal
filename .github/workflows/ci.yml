name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-service/requirements.txt

      - name: Install Python dependencies
        run: pip install -r data-service/requirements.txt

      - name: Run Python tests
        run: PYTHONPATH=data-service python -m unittest discover -s data-service/tests -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build production frontend
        run: npm run build

      - name: Run frontend tests
        run: npm --prefix frontend run test:unit

      - name: Test Sites package
        run: npm run test:sites
